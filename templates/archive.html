<!DOCTYPE html>
<html>
<head>
    <title>MusicMemoir</title>
     <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
     
     <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="background-overlay"></div>

     <div class="main">
    <h1 class="l">MusicMemoir</h1>
    <p class="t"> every feeling deserves a soundtrack</p>
    </div>

     <div class="circle">
    </div>
   <a href="/archive">
   <div class="nav small">🕒</div>
</a>
<a href="/results">
<div class="nav small1">🎧</div>
</a>
<a href="/index">
<div class="nav small2">🏠</div>
</a>

<div class="cards">
    {% for memory in memories %}
    
<div class="c1 {{ memory.color }}"> 
    <a href="/memory/{{ loop.index0 }}">
     <div class="text">

        <p>date: {{memory.date}}</p>
        <p>memory title: {{memory.title}}</p>
        <p>reflection: {{memory.reflection[:130]}}</p>
    </div></a>
      <a href="{{ url_for('delete', index=loop.index0) }}">
    <div class="bin">
        🗑️
    </div>
</a>
</div>

    {% endfor %}


</div>

</body>
</html>
